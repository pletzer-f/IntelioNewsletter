<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intelio · Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    [data-theme="light"] {
      --bg:#F9F8F5; --surface:#FFFFFF; --surface-hi:#F3F0EB; --border:#E2DFD8; --border-hi:#C8C5BC;
      --text:#0F172A; --text-2:#475569; --text-3:#94A3B8; --accent:#C41E3A; --accent-dim:rgba(196,30,58,0.07);
      --accent-glow:rgba(196,30,58,0.18); --pos:#166534; --pos-bg:rgba(22,101,52,0.09);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);
      min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}
    .nav{padding:0 48px;height:72px;display:flex;align-items:center;border-bottom:1px solid var(--border);}
    .nav-logo{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--text);letter-spacing:-0.025em;text-decoration:none;}
    .nav-logo .io{color:var(--accent);}
    .wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
    .card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);
      border-radius:16px;padding:40px 36px;box-shadow:0 12px 48px rgba(15,23,42,0.08);}
    .card-badge{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border:1px solid var(--border);
      border-radius:20px;font-size:10.5px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:22px;}
    .badge-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);}
    h1{font-family:'Playfair Display',serif;font-size:28px;font-weight:800;letter-spacing:-0.02em;margin-bottom:8px;}
    .sub{font-size:14px;color:var(--text-2);line-height:1.6;margin-bottom:26px;}
    .tabs{display:flex;gap:0;border:1px solid var(--border);border-radius:9px;overflow:hidden;margin-bottom:22px;}
    .tab{flex:1;padding:9px;text-align:center;font-size:13px;font-weight:600;color:var(--text-2);
      background:var(--surface);cursor:pointer;border:none;font-family:inherit;transition:all .18s;}
    .tab.active{background:var(--accent);color:#fff;}
    label{display:block;font-size:12px;font-weight:700;margin-bottom:7px;}
    input{width:100%;padding:11px 14px;background:var(--surface);border:1px solid var(--border);
      border-radius:8px;color:var(--text);font-family:inherit;font-size:14px;outline:none;margin-bottom:16px;transition:border-color .2s,box-shadow .2s;}
    input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
    .btn{width:100%;padding:12px;border:none;border-radius:8px;background:var(--accent);color:#fff;
      font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 4px 14px var(--accent-glow);}
    .btn:hover:not(:disabled){opacity:.9;transform:translateY(-1px);}
    .btn:disabled{opacity:.5;cursor:default;box-shadow:none;}
    .btn-ghost{background:transparent;color:var(--text-2);border:1px solid var(--border);box-shadow:none;margin-top:10px;}
    .btn-ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);transform:none;}
    .hint{font-size:11.5px;color:var(--text-3);margin:-8px 0 16px;line-height:1.5;}
    .msg{font-size:13px;line-height:1.55;padding:11px 14px;border-radius:8px;margin-bottom:18px;display:none;}
    .msg.show{display:block;}
    .msg.err{background:#FEF2F2;color:#B91C1C;border:1px solid #FECACA;}
    .msg.ok{background:var(--pos-bg);color:var(--pos);border:1px solid rgba(22,101,52,0.25);}
    .foot{margin-top:24px;text-align:center;font-size:12px;color:var(--text-3);}
    .foot a{color:var(--accent);text-decoration:none;}
    .pane{display:none;} .pane.active{display:block;}
  </style>
</head>
<body>
  <nav class="nav"><a class="nav-logo" href="/">Intel<span class="io">io</span>.</a></nav>
  <div class="wrap">
    <div class="card">
      <div class="card-badge"><span class="badge-dot"></span> Client access</div>
      <h1>Sign in to Intelio</h1>
      <p class="sub">Access your daily briefings, adjust your focus, and generate on demand.</p>

      <div class="tabs">
        <button class="tab active" id="tab-magic" onclick="switchTab('magic')">Magic link</button>
        <button class="tab" id="tab-pw" onclick="switchTab('pw')">Password</button>
      </div>

      <div class="msg" id="msg"></div>

      <!-- Magic link -->
      <div class="pane active" id="pane-magic">
        <label for="m-email">Work email</label>
        <input type="email" id="m-email" placeholder="you@company.com" autocomplete="email">
        <p class="hint">We'll email you a secure link — no password needed.</p>
        <button class="btn" id="m-btn" onclick="sendMagic()">Send me a login link →</button>
      </div>

      <!-- Password -->
      <div class="pane" id="pane-pw">
        <label for="p-email">Work email</label>
        <input type="email" id="p-email" placeholder="you@company.com" autocomplete="email">
        <label for="p-pass">Password</label>
        <input type="password" id="p-pass" placeholder="••••••••" autocomplete="current-password">
        <button class="btn" id="p-btn" onclick="signInPw()">Sign in →</button>
        <button class="btn btn-ghost" id="p-signup" onclick="signUpPw()">Create an account</button>
        <div style="text-align:center;margin-top:14px"><a href="#" onclick="forgotPw(event)" style="font-size:12.5px;color:var(--text-3);text-decoration:none">Forgot your password?</a></div>
      </div>

      <div class="foot">New here? <a href="/signup.html">Set up a briefing →</a></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const sb = supabase.createClient(window.INTELIO_SUPABASE_URL, window.INTELIO_SUPABASE_KEY);
    const NEXT = new URLSearchParams(location.search).get('next') || '/app';
    const REDIRECT = window.location.origin + NEXT;

    // Already signed in → continue.
    sb.auth.getSession().then(({ data }) => { if (data.session) window.location.replace(NEXT); });

    function switchTab(which) {
      document.getElementById('tab-magic').classList.toggle('active', which === 'magic');
      document.getElementById('tab-pw').classList.toggle('active', which === 'pw');
      document.getElementById('pane-magic').classList.toggle('active', which === 'magic');
      document.getElementById('pane-pw').classList.toggle('active', which === 'pw');
      hideMsg();
    }
    function showMsg(text, kind) {
      const el = document.getElementById('msg');
      el.textContent = text; el.className = 'msg show ' + kind;
    }
    function hideMsg(){ document.getElementById('msg').className = 'msg'; }
    const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);

    async function sendMagic() {
      const email = document.getElementById('m-email').value.trim();
      if (!validEmail(email)) return showMsg('Please enter a valid email address.', 'err');
      const btn = document.getElementById('m-btn'); btn.disabled = true; btn.textContent = 'Sending…';
      const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: REDIRECT } });
      btn.disabled = false; btn.textContent = 'Send me a login link →';
      if (error) return showMsg(error.message, 'err');
      showMsg('Check your inbox — we sent a secure login link to ' + email + '.', 'ok');
    }

    async function signInPw() {
      const email = document.getElementById('p-email').value.trim();
      const password = document.getElementById('p-pass').value;
      if (!validEmail(email) || !password) return showMsg('Enter your email and password.', 'err');
      const btn = document.getElementById('p-btn'); btn.disabled = true; btn.textContent = 'Signing in…';
      const { error } = await sb.auth.signInWithPassword({ email, password });
      btn.disabled = false; btn.textContent = 'Sign in →';
      if (error) return showMsg(error.message, 'err');
      window.location.replace(NEXT);
    }

    async function signUpPw() {
      const email = document.getElementById('p-email').value.trim();
      const password = document.getElementById('p-pass').value;
      if (!validEmail(email)) return showMsg('Please enter a valid email address.', 'err');
      if (!password || password.length < 8) return showMsg('Choose a password of at least 8 characters.', 'err');
      const btn = document.getElementById('p-signup'); btn.disabled = true; btn.textContent = 'Creating…';
      const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: REDIRECT } });
      btn.disabled = false; btn.textContent = 'Create an account';
      if (error) return showMsg(error.message, 'err');
      if (data.session) window.location.replace(NEXT);
      else showMsg('Account created — check your inbox to confirm your email, then sign in.', 'ok');
    }

    async function forgotPw(e) {
      e.preventDefault();
      const email = document.getElementById('p-email').value.trim();
      if (!validEmail(email)) return showMsg('Enter your email in the field above, then click "Forgot your password?".', 'err');
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/reset' });
      if (error) return showMsg(error.message, 'err');
      showMsg('Check your inbox — we sent a password-reset link to ' + email + '.', 'ok');
    }

    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      if (document.getElementById('pane-magic').classList.contains('active')) sendMagic();
      else signInPw();
    });
  </script>
</body>
</html>
