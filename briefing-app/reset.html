<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intelio · Set a new password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    [data-theme="light"]{--bg:#F9F8F5;--surface:#FFFFFF;--border:#E2DFD8;--border-hi:#C8C5BC;--text:#0F172A;--text-2:#475569;--text-3:#94A3B8;--accent:#C41E3A;--accent-dim:rgba(196,30,58,0.07);--accent-glow:rgba(196,30,58,0.18);--pos:#166534;--pos-bg:rgba(22,101,52,0.09);}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}
    .nav{padding:0 48px;height:72px;display:flex;align-items:center;border-bottom:1px solid var(--border);}
    .nav-logo{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--text);letter-spacing:-0.025em;text-decoration:none;}
    .nav-logo .io{color:var(--accent);}
    .wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
    .card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px 36px;box-shadow:0 12px 48px rgba(15,23,42,0.08);}
    .card-badge{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border:1px solid var(--border);border-radius:20px;font-size:10.5px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:22px;}
    .badge-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);}
    h1{font-family:'Playfair Display',serif;font-size:26px;font-weight:800;letter-spacing:-0.02em;margin-bottom:8px;}
    .sub{font-size:14px;color:var(--text-2);line-height:1.6;margin-bottom:24px;}
    label{display:block;font-size:12px;font-weight:700;margin-bottom:7px;}
    input{width:100%;padding:11px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:14px;outline:none;margin-bottom:16px;transition:border-color .2s,box-shadow .2s;}
    input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
    .btn{width:100%;padding:12px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 4px 14px var(--accent-glow);}
    .btn:hover:not(:disabled){opacity:.9;transform:translateY(-1px);}
    .btn:disabled{opacity:.5;cursor:default;box-shadow:none;}
    .msg{font-size:13px;line-height:1.55;padding:11px 14px;border-radius:8px;margin-bottom:18px;display:none;}
    .msg.show{display:block;}
    .msg.err{background:#FEF2F2;color:#B91C1C;border:1px solid #FECACA;}
    .msg.ok{background:var(--pos-bg);color:var(--pos);border:1px solid rgba(22,101,52,0.25);}
    .foot{margin-top:22px;text-align:center;font-size:12.5px;color:var(--text-3);}
    .foot a{color:var(--accent);text-decoration:none;}
  </style>
</head>
<body>
  <nav class="nav"><a class="nav-logo" href="/">Intel<span class="io">io</span>.</a></nav>
  <div class="wrap">
    <div class="card">
      <div class="card-badge"><span class="badge-dot"></span> Account security</div>
      <h1>Set a new password</h1>
      <p class="sub" id="sub">Choose a new password for your Intelio account.</p>
      <div class="msg" id="msg"></div>
      <div id="form">
        <label for="pw1">New password</label>
        <input type="password" id="pw1" placeholder="At least 8 characters" autocomplete="new-password">
        <label for="pw2">Confirm new password</label>
        <input type="password" id="pw2" placeholder="Repeat password" autocomplete="new-password">
        <button class="btn" id="btn" onclick="save()">Update password →</button>
      </div>
      <div class="foot"><a href="/login">← Back to sign in</a></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const sb = supabase.createClient(window.INTELIO_SUPABASE_URL, window.INTELIO_SUPABASE_KEY);

    function showMsg(t, k) { const el = document.getElementById('msg'); el.textContent = t; el.className = 'msg show ' + k; }
    function hideForm() { document.getElementById('form').style.display = 'none'; }

    // A valid session is required to set a password — either from the recovery
    // link (parsed from the URL by supabase-js) or an already-logged-in user.
    let hasSession = false;
    sb.auth.onAuthStateChange((_e, session) => { if (session) hasSession = true; });

    (async function checkAccess() {
      const { data } = await sb.auth.getSession();
      if (data.session) { hasSession = true; return; }
      // Give supabase-js a moment to parse a recovery token from the URL hash.
      setTimeout(async () => {
        const { data: d2 } = await sb.auth.getSession();
        if (!d2.session && !hasSession) {
          hideForm();
          showMsg('This reset link is invalid or has expired. Request a new one from the sign-in page.', 'err');
        }
      }, 1400);
    })();

    async function save() {
      const p1 = document.getElementById('pw1').value;
      const p2 = document.getElementById('pw2').value;
      if (p1.length < 8) return showMsg('Password must be at least 8 characters.', 'err');
      if (p1 !== p2)     return showMsg('The two passwords do not match.', 'err');

      const { data } = await sb.auth.getSession();
      if (!data.session && !hasSession) return showMsg('Your reset link has expired — request a new one from the sign-in page.', 'err');

      const btn = document.getElementById('btn'); btn.disabled = true; btn.textContent = 'Updating…';
      const { error } = await sb.auth.updateUser({ password: p1 });
      btn.disabled = false; btn.textContent = 'Update password →';
      if (error) return showMsg(error.message, 'err');

      hideForm();
      showMsg('✓ Password updated. You can sign in with your new password now.', 'ok');
      setTimeout(() => window.location.replace('/login'), 2500);
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
  </script>
</body>
</html>
